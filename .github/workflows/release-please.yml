name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-firmware:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ESP32-S3 Firmware Binaries
        run: |
          pio run -e esp32s3_supermini
          pio run -e esp32s3_n16r8
          cp .pio/build/esp32s3_supermini/firmware.factory.bin rubberorca-esp32s3-supermini-factory.bin
          cp .pio/build/esp32s3_n16r8/firmware.factory.bin rubberorca-esp32s3-n16r8-factory.bin

      - name: Upload Firmware Assets to Release
        run: |
          gh release upload "$TAG_NAME" \
            rubberorca-esp32s3-supermini-factory.bin \
            rubberorca-esp32s3-n16r8-factory.bin \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Python Unit Tests
        run: python3 -m unittest discover -s python/tests -v

      - name: Build Python Package (SDK + CLI + MCP)
        run: |
          python -m pip install --upgrade build
          python -m build python

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  update-homebrew-tap:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        id: check_token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping Homebrew tap bump."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout AtaCanYmc/homebrew-tap
        if: steps.check_token.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: AtaCanYmc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula/rubberorca.rb url and sha256
        if: steps.check_token.outputs.enabled == 'true'
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          FORMULA: homebrew-tap/Formula/rubberorca.rb
        run: |
          export TARBALL_URL="https://github.com/AtaCanYmc/RubberOrca/archive/refs/tags/${TAG_NAME}.tar.gz"
          curl -fsSL "$TARBALL_URL" -o /tmp/rubberorca.tar.gz
          export SHA256=$(sha256sum /tmp/rubberorca.tar.gz | awk '{print $1}')

          if [ ! -f "$FORMULA" ]; then
            echo "::error::Formula/rubberorca.rb not found in AtaCanYmc/homebrew-tap. Run /tap-brewer first."
            exit 1
          fi

          python3 -c '
          import os, re, pathlib
          p = pathlib.Path(os.environ["FORMULA"])
          text = p.read_text(encoding="utf-8")
          text = re.sub(r"^  url \".*\"$", f"  url \"{os.environ[\"TARBALL_URL\"]}\"", text, count=1, flags=re.M)
          text = re.sub(r"^  sha256 \"[0-9a-f]{64}\"$", f"  sha256 \"{os.environ[\"SHA256\"]}\"", text, count=1, flags=re.M)
          p.write_text(text, encoding="utf-8")
          '

      - name: Commit and push tap update
        if: steps.check_token.outputs.enabled == 'true'
        working-directory: homebrew-tap
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/rubberorca.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          git add Formula/rubberorca.rb
          git commit -m "chore(formula): bump rubberorca to ${TAG_NAME}"
          git push origin main
