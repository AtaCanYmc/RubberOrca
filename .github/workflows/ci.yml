name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Native Tests and ESP32-S3 Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run Native Unit Tests
        run: pio test -e native

      - name: Build ESP32-S3 Super Mini
        run: pio run -e esp32s3_supermini

      - name: Build ESP32-S3 N16R8
        run: pio run -e esp32s3_n16r8

  governance:
    name: Governance and Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Essential Governance Files
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md ROADMAP.md; do
            test -f "$f" || (echo "Missing $f" && exit 1)
          done

      - name: Validate Internal Documentation Links
        run: |
          python3 -c '
          import re, glob, os, sys

          broken = []
          for f in glob.glob("**/*.md", recursive=True):
              if f.startswith(".pio/"):
                  continue
              content = open(f, encoding="utf-8").read()
              content = re.sub(r"```[\s\S]*?```", "", content)
              content = re.sub(r"`[^`]*`", "", content)
              for link in re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content):
                  link = link.strip().split("?")[0]
                  if not link or link.startswith("#"):
                      continue
                  target = os.path.normpath(os.path.join(os.path.dirname(f), link))
                  if not os.path.exists(target):
                      broken.append(f"{f} -> {link} (resolved: {target})")

          if broken:
              print("Broken internal documentation links:", file=sys.stderr)
              for b in broken:
                  print("  -", b, file=sys.stderr)
              sys.exit(1)
          print("Internal documentation links verified.")
          '
