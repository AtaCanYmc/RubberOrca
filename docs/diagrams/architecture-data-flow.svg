<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="RubberOrca System Data Flow">
  <style>
    .bg { fill: #09090b; }
    .box { fill: #131317; stroke: rgba(255,255,255,0.22); stroke-width: 1.2; }
    .box-accent { fill: #1b1b20; stroke: #ff4500; stroke-width: 1.4; }
    .title { fill: #f4f4f5; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; font-weight: 700; }
    .sub { fill: #9898a3; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 9px; }
    .lifeline { stroke: rgba(255,255,255,0.16); stroke-width: 1; stroke-dasharray: 4 4; }
    .msg { stroke: #f4f4f5; stroke-width: 1.4; fill: none; }
    .msg-accent { stroke: #ff4500; stroke-width: 1.5; fill: none; }
    .msg-dash { stroke: #9898a3; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
    .lbl { fill: #d4d4d8; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; }
    .lbl-accent { fill: #ff4500; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; font-weight: 700; }
    .hdr { fill: #9898a3; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#f4f4f5" />
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#ff4500" />
    </marker>
    <marker id="arr-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#9898a3" />
    </marker>
  </defs>

  <rect width="880" height="420" class="bg" />
  <text x="24" y="26" class="hdr">FIG 01 // SYSTEM DATA FLOW (CORE 0 NIMBLE -&gt; CORE 1 LOOP -&gt; TINYUSB HID)</text>

  <!-- Participants -->
  <g>
    <rect x="24" y="46" width="124" height="44" rx="6" class="box" />
    <text x="86" y="66" text-anchor="middle" class="title">RubberOtter</text>
    <text x="86" y="80" text-anchor="middle" class="sub">BLE Client</text>
    <line x1="86" y1="90" x2="86" y2="392" class="lifeline" />

    <rect x="166" y="46" width="124" height="44" rx="6" class="box" />
    <text x="228" y="66" text-anchor="middle" class="title">BleTransport</text>
    <text x="228" y="80" text-anchor="middle" class="sub">Core 0 NimBLE</text>
    <line x1="228" y1="90" x2="228" y2="392" class="lifeline" />

    <rect x="308" y="46" width="124" height="44" rx="6" class="box" />
    <text x="370" y="66" text-anchor="middle" class="title">PacketParser</text>
    <text x="370" y="80" text-anchor="middle" class="sub">Core 1 loopTask</text>
    <line x1="370" y1="90" x2="370" y2="392" class="lifeline" />

    <rect x="450" y="46" width="124" height="44" rx="6" class="box" />
    <text x="512" y="66" text-anchor="middle" class="title">CommandExec</text>
    <text x="512" y="80" text-anchor="middle" class="sub">Dispatch + NVS</text>
    <line x1="512" y1="90" x2="512" y2="392" class="lifeline" />

    <rect x="592" y="46" width="124" height="44" rx="6" class="box-accent" />
    <text x="654" y="66" text-anchor="middle" class="title">TinyUSB HID</text>
    <text x="654" y="80" text-anchor="middle" class="sub">Silicon OTG</text>
    <line x1="654" y1="90" x2="654" y2="392" class="lifeline" />

    <rect x="734" y="46" width="124" height="44" rx="6" class="box" />
    <text x="796" y="66" text-anchor="middle" class="title">Target Host</text>
    <text x="796" y="80" text-anchor="middle" class="sub">macOS / Win / Linux</text>
    <line x1="796" y1="90" x2="796" y2="392" class="lifeline" />
  </g>

  <!-- Sequence Messages -->
  <g>
    <path d="M 86 122 L 222 122" class="msg" marker-end="url(#arr)" />
    <text x="154" y="115" text-anchor="middle" class="lbl">GATT 0xFFE1 (STX..ETX)</text>

    <path d="M 228 148 L 258 148 L 258 168 L 234 168" class="msg" marker-end="url(#arr)" />
    <text x="266" y="161" class="sub">rxBuf + portMUX_TYPE</text>

    <path d="M 370 198 L 234 198" class="msg-dash" marker-end="url(#arr-muted)" />
    <text x="299" y="191" text-anchor="middle" class="lbl">bleTransport_read()</text>

    <path d="M 370 222 L 400 222 L 400 242 L 376 242" class="msg" marker-end="url(#arr)" />
    <text x="408" y="235" class="sub">Verify VER, LEN, XOR</text>

    <path d="M 370 272 L 506 272" class="msg" marker-end="url(#arr)" />
    <text x="438" y="265" text-anchor="middle" class="lbl">execute_command(payload, seq)</text>

    <path d="M 512 304 L 648 304" class="msg-accent" marker-end="url(#arr-acc)" />
    <text x="580" y="297" text-anchor="middle" class="lbl-accent">Kbd / Mouse / Consumer</text>

    <path d="M 654 334 L 790 334" class="msg-accent" marker-end="url(#arr-acc)" />
    <text x="722" y="327" text-anchor="middle" class="lbl-accent">Wired USB HID packet</text>

    <path d="M 512 362 L 234 362" class="msg-dash" marker-end="url(#arr-muted)" />
    <text x="373" y="355" text-anchor="middle" class="lbl">sendAck(seq, ok, code) via 0xFFE1 Notify</text>

    <path d="M 228 386 L 92 386" class="msg-dash" marker-end="url(#arr-muted)" />
    <text x="160" y="379" text-anchor="middle" class="lbl">6-byte ACK frame</text>
  </g>
</svg>
