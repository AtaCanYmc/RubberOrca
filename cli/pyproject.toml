[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubberorca"
version = "0.1.0"
description = "CLI and transport client for RubberOrca ESP32-S3 USB HID over BLE 5.0 GATT and USB CDC Serial."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
  "bleak>=0.22",
  "pyserial>=3.5",
]

[project.scripts]
rubberorca = "rubberorca.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rubberorca*"]
