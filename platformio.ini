[platformio]
default_envs = esp32s3_supermini

[env]
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBLE_DEFAULT_NAME=\"RubberOrca\"

[env:esp32s3_supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lolin_s3_mini
board_build.partitions = huge_app.csv
build_flags =
  ${env.build_flags}
  -DRO_BOARD_SUPERMINI

[env:esp32s3_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.partitions = default_16MB.csv
build_flags =
  ${env.build_flags}
  -DRO_BOARD_N16R8

[env:native]
platform = native
framework =
test_build_src = yes
build_src_filter =
  +<Utils.cpp>
  +<PacketParser.cpp>
  +<CommandExecutor.cpp>
build_flags =
  -std=c++17
  -DRO_NATIVE_TEST
